; ============================================================
; docker/php/php.ini — PHP 8.2 configurado para producción
; Dashboard Tecnigas (Laravel 11)
; ============================================================

; ── General ──────────────────────────────────────────────────
date.timezone = America/Lima
default_charset = UTF-8

; ── Memoria y tiempo de ejecución ────────────────────────────
; OdooService llama catálogos masivos de 4000+ productos.
; El timeout de cURL es 120s, PHP debe sobrevivir eso.
memory_limit = 256M
max_execution_time = 140
max_input_time = 140
default_socket_timeout = 140

; ── Subidas de archivos (BarTender .xlsx) ────────────────────
upload_max_filesize = 50M
post_max_size = 55M
max_file_uploads = 20

; ── Seguridad producción ─────────────────────────────────────
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /var/www/html/storage/logs/php_errors.log
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; ── Sesiones ─────────────────────────────────────────────────
session.gc_maxlifetime = 7200
session.use_strict_mode = 1
session.cookie_httponly = 1
session.cookie_samesite = Lax

; ── Realpath cache (rendimiento en producción) ────────────────
realpath_cache_size = 4096K
realpath_cache_ttl = 600

; ── OPcache (configuración en Dockerfile) ────────────────────
; Ya configurado en /usr/local/etc/php/conf.d/opcache.ini

; ── cURL (OdooService — catálogo masivo) ─────────────────────
; No hay php.ini para cURL pero max_execution_time cubre el timeout de 120s
