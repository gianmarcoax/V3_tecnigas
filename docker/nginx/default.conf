# ============================================================
# docker/nginx/default.conf
# Nginx para Laravel 11 — Dashboard Tecnigas
#
# NOTAS:
# - Sirve el directorio public/ de Laravel
# - Pasa PHP a PHP-FPM (tecnigas_app:9000)
# - Optimizado para producción: gzip, headers de caché
# - Listo para funcionar detrás de Nginx Proxy Manager
# ============================================================

server {
    listen 80;
    listen [::]:80;

    server_name _;

    root /var/www/html/public;
    index index.php;

    # ── Charset y tipos ──────────────────────────────────────
    charset utf-8;

    # ── Límite de tamaño de subida (BarTender .xlsx) ─────────
    client_max_body_size 50M;

    # ── Gzip para rendimiento ─────────────────────────────────
    gzip on;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # ── Headers de seguridad ──────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Forwarded headers (Nginx Proxy Manager los envía) ─────
    # Necesario para que Laravel genere URLs correctas (HTTPS)
    set_real_ip_from 172.16.0.0/12;   # rango redes Docker
    set_real_ip_from 10.0.0.0/8;
    real_ip_header X-Real-IP;

    # ── Assets Vite (build de producción) — caché agresiva ───
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Favicon e íconos — sin log ────────────────────────────
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # ── Ruta principal: reescribir hacia index.php ────────────
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ── PHP-FPM ───────────────────────────────────────────────
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;

        # tecnigas_app = nombre del servicio en docker-compose
        fastcgi_pass tecnigas_app:9000;
        fastcgi_index index.php;

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param DOCUMENT_ROOT $realpath_root;

        # Timeouts para Odoo XML-RPC (hasta 130s — catálogo masivo)
        fastcgi_read_timeout 130s;
        fastcgi_connect_timeout 10s;
        fastcgi_send_timeout 130s;

        # Forwarded headers para Laravel trusted proxies
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
        fastcgi_param HTTP_X_FORWARDED_FOR   $http_x_forwarded_for;
        fastcgi_param HTTPS                  off;
        fastcgi_param HTTP_X_REAL_IP         $http_x_real_ip;
    }

    # ── Denegar acceso a archivos ocultos ─────────────────────
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ── Logs ─────────────────────────────────────────────────
    access_log /var/log/nginx/tecnigas_access.log;
    error_log  /var/log/nginx/tecnigas_error.log warn;
}
